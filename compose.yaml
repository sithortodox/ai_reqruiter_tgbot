# Демо-конфигурация для разработки. Для прода — заполните реальные значения.
# Секреты НЕ коммитить: файл .env в .gitignore.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recruiter}
      POSTGRES_USER: ${POSTGRES_USER:-recruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Резервные копии: каталог бэкапов монтируется в контейнер
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruiter} -d ${POSTGRES_DB:-recruiter}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-recruiter}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recruiter}
    ports:
      - "${ADMIN_WEB_PORT:-8080}:8080"
    volumes:
      - ./storage:/srv/bot/storage

volumes:
  pgdata: